# All tunable numbers for the CLV / churn / retention-allocation pipeline.
# Every module reads these through src/config.py — no magic numbers in module bodies.

seed: 42

paths:
  raw_xlsx: dataset/raw/online-retail-II.xlsx
  interim_dir: dataset/interim
  processed_dir: dataset/processed
  reports_dir: reports
  figures_dir: reports/figures

data:
  sheet_names: ["Year 2009-2010", "Year 2010-2011"]
  # Non-product stock codes: postage, discounts, manual adjustments, bank fees.
  non_product_stock_codes:
    - POST
    - DOT
    - D
    - M
    - m
    - C2
    - C3
    - S
    - "BANK CHARGES"
    - AMAZONFEE
    - ADJUST
    - ADJUST2
    - CRUK
    - TEST001
    - TEST002
    - PADS
    - GIFT
    - B
  non_product_stock_code_regex: "^gift_0001"
  min_duplicate_removed_warning_threshold: 1000  # warn if overlap dedup removes fewer than this

rfm:
  # Dataset spans 2009-12-01 to 2011-12-09 (~740 days).
  calibration_end: "2011-06-09"
  observation_end: "2011-12-09"
  new_cohort_window_days: 60  # first purchase within this many days of calibration_end -> is_new_cohort

btyd:
  sampler:
    draws: 1000
    tune: 1000
    chains: 4
    cores: 4
    target_accept: 0.95
  rhat_threshold: 1.01
  monetary_frequency_correlation_warn_threshold: 0.10
  clv_future_t_months: 12
  discount_rate_monthly: 0.01
  gross_margin: 0.30
  time_unit: "D"

features:
  trend_window_days: 90
  top_n_countries: 5

churn:
  test_size: 0.20
  cv_folds: 5
  random_search_iterations: 30
  calibration_brier_threshold: 0.05  # above this, wrap in CalibratedClassifierCV(isotonic)
  xgb_param_distributions:
    max_depth: [3, 4, 5, 6, 7]
    learning_rate: [0.01, 0.02, 0.05, 0.1, 0.2]
    subsample: [0.6, 0.7, 0.8, 0.9, 1.0]
    colsample_bytree: [0.6, 0.7, 0.8, 0.9, 1.0]
    min_child_weight: [1, 3, 5, 7, 10]
    reg_alpha: [0, 0.01, 0.1, 1.0]
    reg_lambda: [0.1, 1.0, 5.0, 10.0]

allocate:
  total_budget: 5000.0
  uplift: 0.20
  cost_per_customer: 5.0
  uplift_sweep: [0.05, 0.10, 0.20, 0.30, 0.50]
  cost_sweep: [2.5, 5.0, 7.5, 10.0, 15.0]
  n_terciles: 3
